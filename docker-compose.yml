services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: 1v1chat-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/1v1chat.db}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - LLM_MODE=${LLM_MODE:-auto}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - ACCESS_TOKEN_MINUTES=${ACCESS_TOKEN_MINUTES:-30}
      - REFRESH_TOKEN_DAYS=${REFRESH_TOKEN_DAYS:-7}
      - LOGIN_FAIL_LIMIT=${LOGIN_FAIL_LIMIT:-5}
      - LOGIN_LOCK_MINUTES=${LOGIN_LOCK_MINUTES:-15}
      - ADMIN_BOOTSTRAP_USERNAME=${ADMIN_BOOTSTRAP_USERNAME:-}
      - ADMIN_BOOTSTRAP_PASSWORD=${ADMIN_BOOTSTRAP_PASSWORD:-}
      - ENGINE_VERSION=${ENGINE_VERSION:-v1}
      - TURN_TIMEOUT_S=${TURN_TIMEOUT_S:-20}
      - HISTORY_LIMIT=${HISTORY_LIMIT:-10}
      - GUARD_ENABLED=${GUARD_ENABLED:-true}
      - GUARD_SAMPLE_RATE=${GUARD_SAMPLE_RATE:-0.05}
      - MSG_MAX_LEN=${MSG_MAX_LEN:-2000}
      - CHAT_RATE_PER_MIN=${CHAT_RATE_PER_MIN:-30}
      - CORS_ORIGINS=${CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}
      - REDIS_URL=${REDIS_URL:-}
    volumes:
      # named volume：由镜像内属主(uid 10001)初始化，非 root 容器可直接读写
      - app-data:/app/backend/data
      - app-media:/app/backend/media
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 1v1chat-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  app-data:
  app-media:

networks:
  default:
    name: 1v1chat-network
