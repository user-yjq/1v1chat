version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: 1v1chat-backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=${APP_ENV:-dev}
      - APP_DEBUG=${APP_DEBUG:-true}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/1v1chat.db}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com/v1}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - LLM_MODE=${LLM_MODE:-auto}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - ENGINE_VERSION=${ENGINE_VERSION:-v1}
      - TURN_TIMEOUT_S=${TURN_TIMEOUT_S:-20}
      - HISTORY_LIMIT=${HISTORY_LIMIT:-10}
      - GUARD_ENABLED=${GUARD_ENABLED:-true}
      - GUARD_SAMPLE_RATE=${GUARD_SAMPLE_RATE:-0.05}
      - MSG_MAX_LEN=${MSG_MAX_LEN:-2000}
      - CHAT_RATE_PER_MIN=${CHAT_RATE_PER_MIN:-30}
    volumes:
      - ./data:/app/backend/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 1v1chat-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  default:
    name: 1v1chat-network
