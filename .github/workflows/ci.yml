name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + lint (sqlite + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 1v1chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LLM_MODE: mock
      DEEPSEEK_API_KEY: sk-placeholder
      JWT_SECRET: ci-only-secret-not-for-prod
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/1v1chat_test
      PG_MIGRATE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/1v1chat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check backend
        working-directory: .
      - name: Migrate (postgres)
        run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_MIGRATE_URL }}
      - name: Test (sqlite)
        run: pytest -q -p no:warnings
        working-directory: backend
      - name: Test (postgres)
        run: pytest -q -p no:warnings
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Test ratelimit (redis)
        run: pytest -q -p no:warnings tests/engine2_core/test_ratelimit_redis.py
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  docker:
    name: Docker build + smoke + E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f backend/Dockerfile -t 1v1chat-backend:ci .
      - name: Build frontend image
        run: docker build -t 1v1chat-frontend:ci frontend
      - name: Smoke backend readiness
        run: |
          docker run -d --name 1v1chat-smoke \
            -e APP_ENV=dev \
            -e LLM_MODE=mock \
            -e JWT_SECRET=ci-only-secret-not-for-prod \
            -p 18000:8000 1v1chat-backend:ci
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18000/api/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "readiness 未在 30s 内 200"; exit 1; }
          curl -fsS http://127.0.0.1:18000/api/health
          curl -fsS http://127.0.0.1:18000/api/metrics | grep -q '^chat_http_requests_total'
          docker rm -f 1v1chat-smoke >/dev/null
      - name: Start E2E stack (backend mock + seed + frontend)
        run: |
          docker network create 1v1chat-e2e >/dev/null 2>&1 || true
          docker run -d --name e2e-backend --network 1v1chat-e2e --network-alias backend \
            -e LLM_MODE=mock -e JWT_SECRET=e2e-secret-not-prod \
            -v e2e-data:/app/backend/data 1v1chat-backend:ci
          code=""
          for _ in $(seq 1 40); do
            code=$(docker exec e2e-backend curl -s -o /dev/null -w '%{http_code}' \
                     http://127.0.0.1:8000/api/health/ready || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "e2e backend 未就绪"; exit 1; }
          docker exec e2e-backend python seed.py
          docker run -d --name e2e-frontend --network 1v1chat-e2e -p 13000:3000 1v1chat-frontend:ci
          code=""
          for _ in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:13000/ || true)
            [ "$code" = "200" ] && break
            sleep 1
          done
          [ "$code" = "200" ] || { echo "e2e frontend 未就绪"; exit 1; }
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend deps + Playwright chromium
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run E2E smoke (Playwright)
        working-directory: frontend
        run: npx playwright test --reporter=list
