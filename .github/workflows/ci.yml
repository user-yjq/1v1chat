name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend tests + lint (sqlite + postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: 1v1chat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      LLM_MODE: mock
      DEEPSEEK_API_KEY: sk-placeholder
      JWT_SECRET: ci-only-secret-not-for-prod
      TEST_DATABASE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/1v1chat_test
      PG_MIGRATE_URL: postgresql+psycopg2://postgres:postgres@localhost:5432/1v1chat_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest pytest-asyncio ruff
      - name: Lint
        run: ruff check backend
        working-directory: .
      - name: Migrate (postgres)
        run: alembic upgrade head && alembic check
        working-directory: backend
        env:
          DATABASE_URL: ${{ env.PG_MIGRATE_URL }}
      - name: Test (sqlite)
        run: pytest -q -p no:warnings
        working-directory: backend
      - name: Test (postgres)
        run: pytest -q -p no:warnings
        working-directory: backend
        env:
          TEST_DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
      - name: Test ratelimit (redis)
        run: pytest -q -p no:warnings tests/engine2_core/test_ratelimit_redis.py
        working-directory: backend
        env:
          REDIS_URL: redis://localhost:6379/0

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
