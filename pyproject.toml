[project]
name = "1v1chat-backend"
version = "0.4.0a0"
description = "1v1Chat - 人设剧本驱动的 1v1 角色聊天平台 (FastAPI)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    # Web
    "fastapi==0.111.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "python-dotenv==1.0.1",

    # 数据
    "sqlalchemy==2.0.30",
    "pydantic==2.7.0",
    "pydantic-settings==2.2.1",

    # LLM HTTP（OpenAI 兼容）
    "httpx==0.27.0",
    "tenacity==8.2.3",

    # 认证
    "python-jose[cryptography]==3.3.0",
    "bcrypt==5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "pytest-cov==5.0.0",
    "ruff==0.4.7",
]

[tool.uv]
package = false
managed = true

[tool.ruff]
exclude = ["backend/_legacy"]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501", "B008"]  # B008: FastAPI Depends 默认参数是标准写法

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
